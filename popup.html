<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Vertical Tabs Pro</title>
  <style>
    body {
      width: 240px;
      padding: 16px;
      font-family: 'Noto Sans JP', -apple-system, sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      margin: 0;
    }
    h2 { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: #e8eaf0; }
    p { font-size: 11px; color: #8b92a8; margin-bottom: 12px; line-height: 1.5; }
    button {
      width: 100%;
      padding: 9px 14px;
      background: #4f8ef7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <h2>Vertical Tabs Pro</h2>
  <p>サイドパネルで縦型タブを表示します。<br>右側の「⊞」ボタンからも開けます。</p>
  <button id="openPanel">サイドパネルを開く</button>
  <script>
    document.getElementById('openPanel').addEventListener('click', async () => {
      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
      await chrome.sidePanel.open({ windowId: tab.windowId });
      window.close();
    });
  </script>
</body>
</html>
